name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (ex: v1.0.0). Se vazio, usa a versão do package.json'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Compile Standalone Binaries
        run: |
          mkdir -p dist

          echo "Compilando para macOS ARM64 (Apple Silicon)..."
          bun build bin/qr.js --compile --target=bun-darwin-arm64 --outfile dist/qr-darwin-arm64

          echo "Compilando para macOS x64 (Intel)..."
          bun build bin/qr.js --compile --target=bun-darwin-x64 --outfile dist/qr-darwin-x64

          echo "Compilando para Linux x64..."
          bun build bin/qr.js --compile --target=bun-linux-x64 --outfile dist/qr-linux-x64

          echo "Compilando para Linux ARM64..."
          bun build bin/qr.js --compile --target=bun-linux-arm64 --outfile dist/qr-linux-arm64

          echo "Compilando para Windows x64..."
          bun build bin/qr.js --compile --target=bun-windows-x64 --outfile dist/qr-windows-x64.exe

      - name: Package Archives and Checksums
        run: |
          cd dist

          # Compactar para download de arquivos empacotados
          tar -czf qr-darwin-arm64.tar.gz qr-darwin-arm64
          tar -czf qr-darwin-x64.tar.gz qr-darwin-x64
          tar -czf qr-linux-x64.tar.gz qr-linux-x64
          tar -czf qr-linux-arm64.tar.gz qr-linux-arm64
          zip qr-windows-x64.zip qr-windows-x64.exe

          # Gerar checksums SHA-256 para verificação de integridade
          sha256sum qr-* > checksums.txt

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v${PKG_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: QR Code Studio CLI ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/qr-darwin-arm64
            dist/qr-darwin-x64
            dist/qr-linux-x64
            dist/qr-linux-arm64
            dist/qr-windows-x64.exe
            dist/qr-darwin-arm64.tar.gz
            dist/qr-darwin-x64.tar.gz
            dist/qr-linux-x64.tar.gz
            dist/qr-linux-arm64.tar.gz
            dist/qr-windows-x64.zip
            dist/checksums.txt
